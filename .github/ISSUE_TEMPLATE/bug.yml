name: Bug
description: Defeito encontrado em teste (UAT) ou em uso
title: "[Módulo] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Preencha com cuidado: alguém que nunca viu o sistema precisa
        conseguir repetir o problema só lendo esta issue. **Nunca cole senhas, tokens ou dados
        reais de alunos.**

  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - UAT v1
        - Desenvolvimento local
        - Produção
    validations:
      required: true

  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options:
        - Login / sessão / permissões
        - Configuração (operação, países, catálogo, turmas, usuários, modelos, WhatsApp, CRM)
        - CRM (funil, carteira, contatos, tarefas, relatórios, metas)
        - Inbox / WhatsApp / comunicações
        - Matrícula / contrato / Secretaria
        - Alunos / movimentações / portal do aluno
        - Acadêmico (avaliações, correções, segunda chamada, recuperação, fechamento)
        - Diário de aulas / agenda / reposições / gravações
        - Financeiro (cobranças, pagamentos, descontos, aprovações, comissões, permutas)
        - Empresas (B2B)
        - Agente de IA (Aria)
        - Outro
    validations:
      required: true

  - type: dropdown
    id: severidade
    attributes:
      label: Severidade
      description: Crítico = impede fluxo principal ou corrompe dados, sem contorno. Alto = fluxo principal com contorno, ou regra de negócio errada com impacto financeiro/permissão. Médio = funcionalidade secundária ou validação. Baixo = texto/visual.
      options:
        - Crítico
        - Alto
        - Médio
        - Baixo
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do UAT
      description: O campo `sha` de /api/health no momento do teste.
      placeholder: "9e3d1d3c"
    validations:
      required: true

  - type: input
    id: papel
    attributes:
      label: Papel e usuário usados
      description: Só o papel e o apelido ou e-mail de teste. Nunca a senha.
      placeholder: "Vendedor (VEND-A, joao@genius.com)"
    validations:
      required: true

  - type: input
    id: auditoria
    attributes:
      label: Referência na auditoria
      description: Se o roteiro marcou o cenário com X# (bug provável), escreva o código. Senão, deixe vazio.
      placeholder: "X6"
    validations:
      required: false

  - type: input
    id: roteiro
    attributes:
      label: ID do cenário no roteiro
      description: Ex. FIN-12. Se não veio do roteiro, escreva "exploratório".
      placeholder: "FIN-12"
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Numerados, a partir do login. Inclua os dados usados (código do lead, nome do aluno, valor).
      placeholder: |
        1. Logar como Vendedor
        2. Abrir Alunos → A-00012 → Financeiro
        3. Clicar em Renegociar na cobrança C-00034
        4. Escolher Desconto, 12%, vigência "Apenas esta cobrança", confirmar
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: O que deveria acontecer e por quê (doc, roteiro ou decisão do gestor).
    validations:
      required: true

  - type: textarea
    id: obtido
    attributes:
      label: Resultado obtido
      description: O que aconteceu. Copie a mensagem de erro exata se houver.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidência
      description: Arraste aqui print, vídeo ou o trace do Playwright (.zip). Sem dados sensíveis.
    validations:
      required: false

  - type: dropdown
    id: frequencia
    attributes:
      label: Frequência
      options:
        - Sempre
        - Às vezes
        - Só uma vez
    validations:
      required: true

  - type: textarea
    id: observacoes
    attributes:
      label: Observações
      description: Contorno encontrado, hipótese de causa, relação com outra issue.
    validations:
      required: false
