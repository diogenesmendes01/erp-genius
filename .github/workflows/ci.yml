name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_sem_banco?schema=public
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: Reconstruir binários (prisma, @prisma/engines, esbuild)
        run: npm rebuild prisma @prisma/engines esbuild --ignore-scripts=false
      - name: Conferir o binário do esbuild
        run: |
          node -e "require('esbuild')"
          npx esbuild --version
      - name: Gerar o client do Prisma
        run: npx prisma generate
      - name: Gerar os tipos de rota do Next
        run: npx next typegen
      - name: TypeScript (tsc --noEmit)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsc --noEmit

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: ESLint (eslint . --max-warnings 40)
        run: npx eslint . --max-warnings 40
      - name: Lint de migrations (expand-only)
        run: npx tsx scripts/lint-migrations.ts

  test:
    name: test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Sao_Paulo]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: Reconstruir binários (prisma, @prisma/engines, esbuild)
        run: npm rebuild prisma @prisma/engines esbuild --ignore-scripts=false
      - name: Gerar o client do Prisma
        run: npx prisma generate
      - name: Gerar os tipos de rota do Next
        run: npx next typegen
      - name: Testes unitários (npm test — vitest, config padrão, sem *.int.test.ts)
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: Reconstruir binários (prisma, @prisma/engines, esbuild)
        run: npm rebuild prisma @prisma/engines esbuild --ignore-scripts=false
      - name: Gerar o client do Prisma
        run: npx prisma generate
      - name: Build de produção (npm run build — next build)
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: npm run build
