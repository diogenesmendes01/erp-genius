# CI: typecheck, lint e testes unitários em cada PR para a main e em cada push na main.
# Só CI — deploy (CD) fica fora deste workflow.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Um run por branch: push novo cancela o anterior da mesma branch (em PR, a branch de origem).
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Valores de TESTE, nunca segredos reais. Nenhum job conecta em banco: os testes de integração
  # (*.int.test.ts) ficam fora do `npm test` (vitest.config.ts) e rodam à parte com `npm run test:int`.
  # O Prisma só gera o client; a URL existe porque o schema a declara.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_sem_banco?schema=public
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: Gerar o client do Prisma
        run: npx prisma generate
      - name: Gerar os tipos de rota do Next
        run: npx next typegen
      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: ESLint (eslint .)
        run: npx eslint .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: Gerar o client do Prisma
        run: npx prisma generate
      - name: Testes unitários (npm test — vitest, config padrão, sem *.int.test.ts)
        run: npm test
