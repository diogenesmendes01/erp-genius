name: Build e publicação de imagem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('image-pr-{0}', github.event.pull_request.number) || 'image-main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-next:
    name: ${{ github.event_name == 'workflow_dispatch' && 'imagens (dispatch)' || 'build Next.js' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_sem_banco?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        run: npm ci
      - name: Reconstruir binários (prisma, @prisma/engines, esbuild)
        run: npm rebuild prisma @prisma/engines esbuild --ignore-scripts=false
      - name: Gerar o client do Prisma
        run: npx prisma generate
      - name: Build de produção (npm run build)
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: npm run build

  imagens-pr:
    name: imagens sem publicação
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem do app sem publicação
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build da imagem do migrate sem publicação
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: builder
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}

  publicar:
    name: publicar imagens
    runs-on: ubuntu-latest
    needs: [build-next]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build-next.result == 'success' }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      app-digest: ${{ steps.push-app.outputs.digest }}
      migrate-digest: ${{ steps.push-migrate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem do app
        id: meta-app
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Extrair metadados da imagem do migrate
        id: meta-migrate
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrate
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build e publicação da imagem do app (runner)
        id: push-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Build e publicação da imagem do migrate (builder)
        id: push-migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: builder
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Atestar a imagem do app
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-app.outputs.digest }}
          push-to-registry: true

      - name: Atestar a imagem do migrate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/migrate
          subject-digest: ${{ steps.push-migrate.outputs.digest }}
          push-to-registry: true

      - name: Imprimir digests e o commit no resumo
        env:
          APP_DIGEST: ${{ steps.push-app.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.push-migrate.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Imagens publicadas no GHCR"
            echo ""
            echo "- Commit: \`$GIT_SHA\`"
            echo "- App: \`${REGISTRY}/${IMAGE_NAME}@${APP_DIGEST}\`"
            echo "- Migrate: \`${REGISTRY}/${IMAGE_NAME}/migrate@${MIGRATE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
