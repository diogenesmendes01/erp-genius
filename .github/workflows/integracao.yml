name: Integração

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: integracao-${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  integracao:
    name: integração (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: erp_genius_test_ciint
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_genius_test_ciint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ERP_TEST_PROFILE: ci-integracao
      DATABASE_URL: postgres://postgres:teste@localhost:54329/erp_genius_test_ciint
      TZ: America/Sao_Paulo
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (npm ci)
        timeout-minutes: 15
        run: npm ci
      - name: Reconstruir binários (prisma, @prisma/engines, esbuild)
        run: npm rebuild prisma @prisma/engines esbuild --ignore-scripts=false
      - name: Gerar o client do Prisma
        timeout-minutes: 5
        run: npx prisma generate
      - name: Aplicar as migrações do zero (prisma migrate deploy no banco do perfil)
        timeout-minutes: 10
        env:
          PRISMA_TESTE_TIMEOUT_MS: "540000"
        run: node scripts/prisma-teste.mjs migrate deploy
      - name: Diretório de artefatos dos testes
        run: mkdir -p output
      - name: Testes de integração (npm run test:int, shard ${{ matrix.shard }}/4)
        timeout-minutes: 100
        run: npm run test:int -- --shard=${{ matrix.shard }}/4
