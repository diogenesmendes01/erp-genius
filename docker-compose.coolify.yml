# Deploy do ERP Genius no Coolify (v4.3.23+)
# Build pack: Docker Compose · repo Git · deploy automático no merge do main.
#
# Coolify cuida do domínio e TLS via Traefik (porta 80/443 ocupadas por ele), portanto
# o Caddy é OMITIDO. Nenhum serviço publica porta no host — o Traefik roteia o app na
# porta interna 3000 usando a variável mágica SERVICE_FQDN_APP_3000 (doc oficial Coolify).
#
# Uso no Coolify:
#   1. Criar "Resource" → Docker Compose (Git) → apontar este repo + branch main.
#   2. Arquivo: docker-compose.coolify.yml
#   3. Preencher variáveis de ambiente (veja lista no SETUP.md §Coolify).
#   4. Domínio do app: https://erp.geniusidiomas.com:3000 (campo "Domains for app").
#   5. DNS: criar registro A apontando erp.geniusidiomas.com para o IP da VPS.
#   6. Deploy — o Traefik emite TLS automático e roteia https://erp.geniusidiomas.com → app:3000.

name: erp-genius

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no Coolify}
      # ATENÇÃO: senha URL-safe (openssl rand -hex 32), sem / + = (base64 quebra URLs).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no Coolify}
      POSTGRES_DB: erp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10
    # SEM ports: banco na rede interna, nunca internet pública.

  # Migrações ANTES do app (prisma migrate deploy — aditivo e idempotente).
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/erp?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      # Coolify gera SERVICE_FQDN_APP_3000 a partir do domínio configurado no painel.
      # Quando você preenche o campo "Domains for app" com https://erp.geniusidiomas.com:3000,
      # o Coolify gera SERVICE_FQDN_APP_3000=erp.geniusidiomas.com (apenas hostname).
      # O Traefik roteia HTTPS público → app:3000 internamente (porta NÃO publicada no host).
      SERVICE_FQDN_APP_3000: /
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/erp?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina no Coolify}
      # NEXTAUTH_URL: usar a variável DOMINIO_APP preenchida manualmente (ex.: erp.geniusidiomas.com).
      # Ou usar ${SERVICE_FQDN_APP_3000} se o Coolify gerar corretamente.
      NEXTAUTH_URL: https://${DOMINIO_APP:?defina no Coolify}
      AUTH_TRUST_HOST: "true"
      CRON_SECRET: ${CRON_SECRET:?defina no Coolify}
      # Go-live: só ativar após piloto (doc 31 §rollout).
      WHATSAPP_LIVE: ${WHATSAPP_LIVE:-}
      # C3 — copiloto IA (vazio = heurística local "simulado").
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-}
      # Fase 2 — página de pagamento SIMULADA: "1" só em dev/demo, NUNCA em produção.
      PAGAMENTO_SIMULADO: ${PAGAMENTO_SIMULADO:-}
      # Motor WhatsApp na rede interna do compose (nunca a internet).
      MOTOR_URL: http://motor:4317
      MOTOR_API_KEY: ${MOTOR_API_KEY:?defina no Coolify}
      MOTOR_WEBHOOK_SECRET: ${MOTOR_WEBHOOK_SECRET:?defina no Coolify}
    volumes:
      # Mídia WhatsApp + comprovantes (entra no backup).
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness check: valida que o app está pronto (DB acessível, Prisma funcional).
      # Endpoint /api/ready faz SELECT 1 via Prisma — falha se engine errado ou DB down.
      # node:22-alpine tem wget; curl não vem instalado por padrão.
      # 127.0.0.1, NUNCA localhost: o wget do BusyBox resolve localhost para ::1 (IPv6) e não tenta o
      # IPv4; o Next com HOSTNAME=0.0.0.0 escuta só IPv4 → "connection refused" sempre (visto na VPS).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # SEM ports: só o Traefik do Coolify fala com o app.

  # Motor WhatsApp (whatsapp-web-baileys em modo serviço) — FORA da internet pública (rede interna).
  motor:
    image: ${MOTOR_IMAGE:?defina no Coolify}
    restart: unless-stopped
    environment:
      MOTOR_API_KEY: ${MOTOR_API_KEY:?defina no Coolify}
      MOTOR_MODE: servico
      ERP_WEBHOOK_URL: http://app:3000/api/whatsapp/webhook/motor
      MOTOR_WEBHOOK_SECRET: ${MOTOR_WEBHOOK_SECRET:?defina no Coolify}
      HOST: "0.0.0.0"
      PORT: "4317"
      WA_DATA_DIR: /data
    volumes:
      # PGlite, chave do cofre, credenciais e mídia do motor (entra no backup).
      - motor_data:/data
    # SEM ports: o motor não sai para a internet.

  # TICK DO CRON (B4, doc 32): bate no endpoint da régua a cada 5 min.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    # Comando em uma linha só (sem quebras) — o bloco >- mantém \n nas linhas indentadas.
    command:
      - sh
      - -c
      - 'while true; do curl -sS -X POST -H "x-cron-secret: $$CRON_SECRET" http://app:3000/api/whatsapp/cron -o /dev/null -w "cron tick %{http_code}\n" || true; sleep 300; done'
    environment:
      CRON_SECRET: ${CRON_SECRET:?defina no Coolify}
    depends_on:
      - app

  # DESPACHO A CADA MINUTO: mensagens agendadas pelo atendimento saem na hora marcada.
  cron-despacho:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'while true; do curl -sS -X POST -H "x-cron-secret: $$CRON_SECRET" http://app:3000/api/whatsapp/despacho -o /dev/null -w "despacho tick %{http_code}\n" || true; sleep 60; done'
    environment:
      CRON_SECRET: ${CRON_SECRET:?defina no Coolify}
    depends_on:
      - app

volumes:
  db_data:
  uploads:
  motor_data:
